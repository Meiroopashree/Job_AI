name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Backend syntax check
        run: python -m compileall -q backend/app

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: job-ai-frontend/package-lock.json

      - name: Frontend audit report (non-blocking)
        working-directory: job-ai-frontend
        run: npm audit --audit-level=high || true

      - name: Frontend lint + typecheck + build
        working-directory: job-ai-frontend
        run: |
          npm ci
          npm install --no-save "lightningcss-linux-x64-gnu@$(node -p "require('lightningcss/package.json').version")"
          npx tsc --noEmit
          npm run lint
          npm run build

  deploy-backend:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"branch":"main","clearCache":"do_not_clear"}'

  deploy-frontend:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: job-ai-frontend/package-lock.json

      - name: Deploy to Vercel
        working-directory: job-ai-frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm ci
          npx --yes vercel deploy --prod --yes --token "$VERCEL_TOKEN" --scope team_oikHGu2Ys0q7fazWOiOhWFVV