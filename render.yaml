# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: jobai-api
    runtime: python
    pythonVersion: "3.11"
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jobai-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MISTRAL_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://job-ai-frontend-beryl.vercel.app"

databases:
  - name: jobai-db
    plan: free
    databaseName: jobai
    user: jobai